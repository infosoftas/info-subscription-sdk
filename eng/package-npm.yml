# Triggered automatically when a CalVer tag (e.g. 2024.8.1) is pushed to GitHub.
# See RELEASE.md for the full release process.
trigger:
  tags:
    include:
      - '[0-9]*'
pr: none

variables:
  NODE_VERSION: '20.x'
  PackageDirectory: '$(Build.ArtifactStagingDirectory)/npm'

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: Pack
  displayName: 'Build and Pack npm Package'
  jobs:
  - job: pack_npm
    displayName: 'Build and Pack'
    steps:
    - checkout: self
      fetchDepth: 0

    - script: |
        TAG=$(git tag --points-at HEAD)
        if [ -z "$TAG" ]; then
          echo "##vso[task.logissue type=error]No tag found on HEAD. Create and push a CalVer tag (e.g. 2024.8.1) before releasing."
          exit 1
        fi
        echo "Releasing version: $TAG"
        echo "##vso[task.setvariable variable=ReleaseTag]$TAG"
      displayName: 'Validate tag on HEAD'

    - task: UseNode@1
      displayName: 'Setup Node.js'
      inputs:
        version: $(NODE_VERSION)

    - task: Cache@2
      displayName: 'Cache npm packages'
      inputs:
        key: 'npm | "$(Agent.OS)" | "$(NODE_VERSION)" | typescript-sdk/package-lock.json'
        path: 'typescript-sdk/node_modules'
        cacheHitVar: 'NPM_CACHE_RESTORED'

    - script: npm ci
      displayName: 'Install dependencies'
      condition: ne(variables['NPM_CACHE_RESTORED'], 'true')
      workingDirectory: typescript-sdk

    - script: npm run build
      displayName: 'Build TypeScript'
      workingDirectory: typescript-sdk

    - script: |
        mkdir -p $(PackageDirectory)
        npm version $(ReleaseTag) --no-git-tag-version
        npm pack --pack-destination $(PackageDirectory)
      displayName: 'Pack npm package'
      workingDirectory: typescript-sdk

    - publish: $(PackageDirectory)
      artifact: npm

- stage: Deploy
  displayName: 'Publish to npmjs.org'
  dependsOn: Pack
  condition: succeeded()
  jobs:
  - job: deploy_npm
    displayName: 'Push to npmjs.org'
    steps:
    - checkout: self
      fetchDepth: 0

    - download: current
      artifact: npm

    - task: UseNode@1
      displayName: 'Setup Node.js'
      inputs:
        version: $(NODE_VERSION)

    - script: |
        echo "//registry.npmjs.org/:_authToken=$(NPM_TOKEN)" > .npmrc
        npm publish *.tgz --registry https://registry.npmjs.org/
      displayName: 'Publish to npmjs.org'
      workingDirectory: '$(Pipeline.Workspace)/npm'
      env:
        NPM_TOKEN: $(NPM_TOKEN)

    - script: |
        TAG=$(git tag --points-at HEAD)
        echo "##vso[task.setvariable variable=ReleaseTag]$TAG"
      displayName: 'Resolve release tag'

    - task: get-github-token-task@1
      displayName: Get GitHub token
      name: getGitHubToken
      inputs:
        githubServiceConnection: 'infosoftas'

    - script: |
        if gh release view "$(ReleaseTag)" --repo infosoftas/didactic-octo-chainsaw >/dev/null 2>&1; then
          echo "GitHub Release $(ReleaseTag) already exists -- skipping creation"
        else
          gh release create "$(ReleaseTag)" \
            --repo infosoftas/didactic-octo-chainsaw \
            --title "$(ReleaseTag)" \
            --generate-notes \
            --notes "## Packages
        - NuGet: [Infosoft.Info.Subscription.Dotnet@$(ReleaseTag)](https://www.nuget.org/packages/Infosoft.Info.Subscription.Dotnet/$(ReleaseTag))
        - npm: [@infosoft/info-subscription-ts@$(ReleaseTag)](https://www.npmjs.com/package/@infosoft/info-subscription-ts/v/$(ReleaseTag))
        - PyPI: [infosoft-info-subscription@$(ReleaseTag)](https://pypi.org/project/infosoft-info-subscription/$(ReleaseTag)/)"
        fi
      displayName: 'Create GitHub Release'
      env:
        GH_TOKEN: $(GitHub.InstallationToken)
