# Tag bot: computes the next CalVer version whenever `main` changes under an SDK source tree.
# Step 3 of AUTO-RELEASE-STRATEGY.md — runs in DRY-RUN by default: it logs the tag it *would*
# push but does not create or push anything. Flip the `dryRun` variable to 'false' (step 4 of
# the strategy) once a few dry-run cycles have been reviewed and trusted.
#
# See RELEASE.md for the CalVer format (YYYY.M.MICRO, unpadded) and what pushing a tag triggers.
trigger:
  branches:
    include:
      - main
  paths:
    include:
      - dotnet-sdk/src
      - typescript-sdk/src
      - python-sdk/src
pr: none

variables:
  dryRun: true

pool:
  name: Release
  demands:
    - Agent.OS -equals Linux

resources:
  repositories:
    - repository: self
      type: github
      name: infosoftas/didactic-octo-chainsaw
      endpoint: Github-SDKs # <-- Service Connection name

stages:
- stage: TagBot
  displayName: 'Compute next release tag'
  jobs:
  - job: computeTag
    displayName: 'Compute next CalVer tag'
    steps:
    - checkout: self
      fetchDepth: 0        # need full tag history to find the highest MICRO this month
      persistCredentials: true  # needed once dryRun is disabled and the bot pushes a tag

    - script: |
        set -euo pipefail

        HEAD_TAG=$(git tag --points-at HEAD)
        if [ -n "$HEAD_TAG" ]; then
          echo "HEAD is already tagged ($HEAD_TAG). Nothing to do."
          echo "##vso[task.setvariable variable=ShouldTag;isOutput=true]false"
          exit 0
        fi

        YEAR=$(date -u +%Y)
        MONTH=$(date -u +%-m)   # unpadded month, per RELEASE.md CalVer rules

        HIGHEST_MICRO=0
        for t in $(git tag --list "${YEAR}.${MONTH}.*"); do
          MICRO="${t##*.}"
          if [[ "$MICRO" =~ ^[0-9]+$ ]] && [ "$MICRO" -gt "$HIGHEST_MICRO" ]; then
            HIGHEST_MICRO=$MICRO
          fi
        done

        NEXT_TAG="${YEAR}.${MONTH}.$((HIGHEST_MICRO + 1))"

        echo "Next release tag would be: $NEXT_TAG"
        echo "##vso[task.setvariable variable=NextTag;isOutput=true]$NEXT_TAG"
        echo "##vso[task.setvariable variable=ShouldTag;isOutput=true]true"
      name: computeTag
      displayName: 'Compute next CalVer tag'

    - script: |
        echo "[dry-run] Would run: git tag $(computeTag.NextTag) && git push origin $(computeTag.NextTag)"
        echo "Dry-run mode is on (variable 'dryRun' = true). No tag was created or pushed."
      displayName: 'Dry-run: log tag (no push)'
      condition: and(succeeded(), eq(variables['computeTag.ShouldTag'], 'true'), eq(variables['dryRun'], 'true'))

    - script: |
        git config user.name "S4 Release Bot"
        git config user.email "s4-release-bot@users.noreply.github.com"
        git tag $(computeTag.NextTag)
        git push origin $(computeTag.NextTag)
      displayName: 'Push release tag'
      condition: and(succeeded(), eq(variables['computeTag.ShouldTag'], 'true'), ne(variables['dryRun'], 'true'))
