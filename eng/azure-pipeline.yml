trigger: none
pr: none

schedules:
- cron: '0 3 * * 1'
  displayName: 'Weekly Monday 03:00 UTC'
  branches:
    include:
    - main
  always: true  # run even if the repo has no new commits — the OpenAPI spec is external

pool:
  name: Release
  demands:
    - Agent.OS -equals Linux

resources:
  repositories:
    - repository: self
      type: github
      name: infosoftas/didactic-octo-chainsaw
      endpoint: Github-SDKs # <-- Service Connection name

variables:
  #githubToken: ${{ secrets.GITHUB_TOKEN }}
  branchName: 'sdk-update-$(today)-$(Build.BuildId)'
  buildId: '$(Build.BuildId)'
  today: $[ format('{0:yyyy}{0:MM}{0:dd}', pipeline.startTime) ]
  node.version: '20.x'
  kiotaIncludePaths: >-
    --include-path /subscription
    --include-path /product
    --include-path /package
    --include-path /order
    --include-path /order/**
    --include-path /subscriber
    --include-path /vippsmobilepay/agreement**/remote
    --include-path /invoice
    --include-path /invoice/**
    --include-path /reminder
    --include-path /reminder/**
    --include-path /creditnote
    --include-path /creditnote/**
    --include-path /paymentdemand
    --include-path /paymentdemand/**
    --include-path /billingfrequency
    --include-path /billingfrequency/**
    --include-path /organization
    --include-path /organization/**
    --include-path /payment
    --include-path /payment/**

# All three SDKs share one version number and are regenerated from the same OpenAPI spec, so they
# are generated, validated, committed and released as a single unit: one branch, one PR, one tag.
# Running the three languages sequentially in one job (rather than three parallel stages) avoids
# the three-way race that would otherwise produce three branches and three PRs for one spec change.
stages:
- stage: generate_sdks
  displayName: 'Generate SDKs'
  variables:
    dotnetChanged: true
    tsChanged: true
    pythonChanged: true
  jobs:
  - job: generateSdks
    displayName: 'Generate, validate and publish preview SDKs'
    steps:
    - checkout: self
      persistCredentials: true

    - task: UseDotNet@2
      inputs:
        packageType: 'sdk'
        version: '10.x'

    - task: DotNetCoreCLI@2
      displayName: 'Install kiota as a dotnet tool'
      inputs:
        command: custom
        custom: tool
        arguments: 'install --global Microsoft.OpenApi.Kiota'

    # --- Detect per-language changes (each generates into a throwaway dir and diffs it) ---

    - script: |
        kiota generate --co --openapi https://api.info-subscription.com/swagger/latest/swagger.json $(kiotaIncludePaths) -l csharp -c InfoSubscription -n info.subscription.dotnet --output dotnet-sdk/src/generated-temp
        diff -qr dotnet-sdk/src/generated-temp dotnet-sdk/src/generated -x .kiota.log -x kiota-lock.json && echo "##vso[task.setvariable variable=dotnetChanged]false" || true
        rm -rf dotnet-sdk/src/generated-temp
      displayName: 'Detect change: .NET SDK'

    - script: |
        kiota generate --co --openapi https://api.info-subscription.com/swagger/latest/swagger.json $(kiotaIncludePaths) -l TypeScript -c InfoSubscription -n info.subscription.ts --output typescript-sdk/src/generated-temp
        diff -qr typescript-sdk/src/generated-temp typescript-sdk/src/generated -x .kiota.log -x kiota-lock.json && echo "##vso[task.setvariable variable=tsChanged]false" || true
        rm -rf typescript-sdk/src/generated-temp
      displayName: 'Detect change: TypeScript SDK'

    - script: |
        kiota generate --co --openapi https://api.info-subscription.com/swagger/latest/swagger.json $(kiotaIncludePaths) -l python -c InfoSubscription -n info_subscription --output python-sdk/src/info_subscription_sdk/generated-temp
        diff -qr python-sdk/src/info_subscription_sdk/generated-temp python-sdk/src/info_subscription_sdk/generated -x .kiota.log -x kiota-lock.json && echo "##vso[task.setvariable variable=pythonChanged]false" || true
        rm -rf python-sdk/src/info_subscription_sdk/generated-temp
      displayName: 'Detect change: Python SDK'

    - script: |
        if [ "$(dotnetChanged)" = "true" ] || [ "$(tsChanged)" = "true" ] || [ "$(pythonChanged)" = "true" ]; then
          echo "##vso[task.setvariable variable=anyChanged]true"
        else
          echo "##vso[task.setvariable variable=anyChanged]false"
        fi
        echo "dotnetChanged=$(dotnetChanged) tsChanged=$(tsChanged) pythonChanged=$(pythonChanged)"
      displayName: 'Combine change flags'

    # --- Regenerate onto one shared branch, only for languages that actually changed ---

    - script: |
        git config user.name "Azure Pipelines Bot"
        git config user.email "azure-pipelines-bot@users.noreply.github.com"
        git checkout -b $(branchName)
      displayName: 'Create shared feature branch'
      condition: and(succeeded(), eq(variables['anyChanged'], 'true'))

    - script: |
        kiota generate --co --openapi https://api.info-subscription.com/swagger/latest/swagger.json $(kiotaIncludePaths) -l csharp -c InfoSubscription -n info.subscription.dotnet --output dotnet-sdk/src/generated
        git add dotnet-sdk/src/generated
      displayName: 'Regenerate: .NET SDK'
      condition: and(succeeded(), eq(variables['anyChanged'], 'true'), eq(variables['dotnetChanged'], 'true'))

    - script: |
        kiota generate --co --openapi https://api.info-subscription.com/swagger/latest/swagger.json $(kiotaIncludePaths) -l TypeScript -c InfoSubscription -n info.subscription.ts --output typescript-sdk/src/generated
        git add typescript-sdk/src/generated
      displayName: 'Regenerate: TypeScript SDK'
      condition: and(succeeded(), eq(variables['anyChanged'], 'true'), eq(variables['tsChanged'], 'true'))

    - script: |
        kiota generate --co --openapi https://api.info-subscription.com/swagger/latest/swagger.json $(kiotaIncludePaths) -l python -c InfoSubscription -n info_subscription --output python-sdk/src/info_subscription_sdk/generated
        git add python-sdk/src/info_subscription_sdk/generated
      displayName: 'Regenerate: Python SDK'
      condition: and(succeeded(), eq(variables['anyChanged'], 'true'), eq(variables['pythonChanged'], 'true'))

    - script: |
        # kiota isn't guaranteed byte-identical across two runs; this second generation may end up
        # matching what's already on main even though the first diff found a change for every
        # language. Guard against pushing a branch with no real commits, which fails PR creation.
        if git diff --cached --quiet; then
          echo "No actual changes after regeneration; skipping branch push and downstream steps."
          echo "##vso[task.setvariable variable=anyChanged]false"
        fi
      displayName: 'Guard against empty commit'
      condition: and(succeeded(), eq(variables['anyChanged'], 'true'))

    # --- Validate only the languages that were regenerated ---

    - script: |
        dotnet build dotnet-sdk/src/Info.Subscription.Dotnet.csproj --configuration Release
      displayName: 'Validate: build .NET SDK'
      condition: and(succeeded(), eq(variables['anyChanged'], 'true'), eq(variables['dotnetChanged'], 'true'))

    - task: UseNode@1
      displayName: 'Setup Node.js'
      condition: and(succeeded(), eq(variables['anyChanged'], 'true'), eq(variables['tsChanged'], 'true'))
      inputs:
        version: '$(node.version)'

    - task: Cache@2
      displayName: 'Cache npm packages'
      condition: and(succeeded(), eq(variables['anyChanged'], 'true'), eq(variables['tsChanged'], 'true'))
      inputs:
        key: 'npm | "$(Agent.OS)" | "$(node.version)" | typescript-sdk/package-lock.json'
        path: 'typescript-sdk/node_modules'
        cacheHitVar: 'NPM_CACHE_RESTORED'

    - script: npm ci
      displayName: 'Install npm dependencies'
      condition: and(succeeded(), eq(variables['anyChanged'], 'true'), eq(variables['tsChanged'], 'true'), ne(variables['NPM_CACHE_RESTORED'], 'true'))
      workingDirectory: typescript-sdk

    - script: |
        set -e
        npm run build
        # Smoke test: the compiled barrel export must load and expose the public API.
        node -e "const sdk = require('./dist/index.js'); if (typeof sdk.createInfoSubscriptionClient !== 'function') { throw new Error('createInfoSubscriptionClient missing from package entry point'); }"
      displayName: 'Validate: build and smoke test TypeScript SDK'
      condition: and(succeeded(), eq(variables['anyChanged'], 'true'), eq(variables['tsChanged'], 'true'))
      workingDirectory: typescript-sdk

    - script: |
        if command -v python3 &>/dev/null; then
          PYTHON_BIN=python3
        elif command -v python &>/dev/null; then
          PYTHON_BIN=python
        else
          echo "##vso[task.logissue type=error]No Python binary found on PATH"
          exit 1
        fi
        PYTHON_VERSION=$($PYTHON_BIN --version 2>&1 | awk '{print $2}')
        echo "Detected: $PYTHON_BIN ($PYTHON_VERSION)"
        echo "##vso[task.setvariable variable=PYTHON_BIN]$PYTHON_BIN"
        echo "##vso[task.setvariable variable=python.version]$PYTHON_VERSION"
      displayName: 'Detect Python binary'
      condition: and(succeeded(), eq(variables['anyChanged'], 'true'), eq(variables['pythonChanged'], 'true'))

    - task: Cache@2
      displayName: 'Cache pip download cache'
      condition: and(succeeded(), eq(variables['anyChanged'], 'true'), eq(variables['pythonChanged'], 'true'))
      inputs:
        key: 'pip | "$(Agent.OS)" | "$(python.version)" | python-sdk/requirements.txt | python-sdk/requirements-dev.txt'
        path: '$(HOME)/.cache/pip'
        restoreKeys: |
          pip | "$(Agent.OS)" | "$(python.version)"

    - script: |
        $(PYTHON_BIN) -m venv python-sdk/.venv
        source python-sdk/.venv/bin/activate
        python -m pip install --upgrade pip setuptools wheel
        pip install -r python-sdk/requirements.txt
        pip install -r python-sdk/requirements-dev.txt
        pip install -e python-sdk/.
      displayName: 'Install Python dependencies'
      condition: and(succeeded(), eq(variables['anyChanged'], 'true'), eq(variables['pythonChanged'], 'true'))

    - script: |
        set -e
        source python-sdk/.venv/bin/activate
        # Smoke test: the package and the generated client must import cleanly.
        python -c "import info_subscription_sdk as sdk; from info_subscription_sdk.generated.info_subscription import InfoSubscription; assert callable(sdk.create_info_subscription_client)"
      displayName: 'Validate: import Python SDK'
      condition: and(succeeded(), eq(variables['anyChanged'], 'true'), eq(variables['pythonChanged'], 'true'))

    # --- Commit and push the single shared branch ---

    - script: |
        set -e
        changed=""
        [ "$(dotnetChanged)" = "true" ] && changed="$changed .NET"
        [ "$(tsChanged)" = "true" ] && changed="$changed TypeScript"
        [ "$(pythonChanged)" = "true" ] && changed="$changed Python"
        git commit -m "Update SDKs from latest OpenAPI spec ($changed )"
        git push --set-upstream origin $(branchName)
        sleep 2 # We wait a bit to avoid issues where the next step happens too fast!
      displayName: 'Push shared feature branch'
      condition: and(succeeded(), eq(variables['anyChanged'], 'true'))

    # --- Publish preview packages only for the languages that changed ---

    - script: |
        dotnet pack dotnet-sdk/src/Info.Subscription.Dotnet.csproj \
          --configuration Release \
          -p:Version=0.0.0-preview$(today)$(Build.BuildId) \
          -p:ContinuousIntegrationBuild=true \
          --output $(Build.ArtifactStagingDirectory)/nuget
      displayName: 'Pack NuGet (preview)'
      condition: and(succeeded(), eq(variables['anyChanged'], 'true'), eq(variables['dotnetChanged'], 'true'))

    - task: DotNetCoreCLI@2
      displayName: 'Push preview package to ADO NuGet feed'
      condition: and(succeeded(), eq(variables['anyChanged'], 'true'), eq(variables['dotnetChanged'], 'true'))
      inputs:
        command: 'push'
        packagesToPush: '$(Build.ArtifactStagingDirectory)/nuget/*.nupkg;$(Build.ArtifactStagingDirectory)/nuget/*.snupkg'
        nuGetFeedType: 'internal'
        publishVstsFeed: 'aeefa1b4-7b70-48a5-910f-324156d70b86'

    - script: |
        npm version 0.0.0-preview.$(today)$(Build.BuildId) --no-git-tag-version
        git restore package-lock.json
      displayName: 'Set TypeScript preview version'
      condition: and(succeeded(), eq(variables['anyChanged'], 'true'), eq(variables['tsChanged'], 'true'))
      workingDirectory: typescript-sdk

    - task: Npm@1
      displayName: 'Push preview package to ADO npm feed'
      condition: and(succeeded(), eq(variables['anyChanged'], 'true'), eq(variables['tsChanged'], 'true'))
      inputs:
        command: 'publish'
        workingDir: 'typescript-sdk'
        publishRegistry: 'useFeed'
        publishFeed: 'aeefa1b4-7b70-48a5-910f-324156d70b86'

    - script: |
        source python-sdk/.venv/bin/activate
        cd python-sdk
        sed -i "s/^version = \".*\"/version = \"0.0.0.dev$(today)$(Build.BuildId)\"/" pyproject.toml
        python -m build --outdir $(Build.ArtifactStagingDirectory)/python
      displayName: 'Build Python package (preview)'
      condition: and(succeeded(), eq(variables['anyChanged'], 'true'), eq(variables['pythonChanged'], 'true'))

    - task: TwineAuthenticate@1
      displayName: 'Authenticate with ADO Python feed'
      condition: and(succeeded(), eq(variables['anyChanged'], 'true'), eq(variables['pythonChanged'], 'true'))
      inputs:
        artifactFeed: 'Internal'

    - script: |
        source python-sdk/.venv/bin/activate
        twine upload -r 'Internal' --config-file $(PYPIRC_PATH) $(Build.ArtifactStagingDirectory)/python/*
      displayName: 'Push preview package to ADO Python feed'
      condition: and(succeeded(), eq(variables['anyChanged'], 'true'), eq(variables['pythonChanged'], 'true'))

    # --- One PR for the whole update ---

    - task: get-github-token-task@1
      displayName: Get GitHub token
      name: getGitHubToken
      condition: and(succeeded(), eq(variables['anyChanged'], 'true'))
      inputs:
        githubServiceConnection: 'infosoftas'

    - script: |
        changed=""
        [ "$(dotnetChanged)" = "true" ] && changed="$changed\n- .NET"
        [ "$(tsChanged)" = "true" ] && changed="$changed\n- TypeScript"
        [ "$(pythonChanged)" = "true" ] && changed="$changed\n- Python"
        body=$(printf "Generated by Kiota and ADO.\n\nSDKs updated:$changed")
        gh pr create --title "S4 SDK Update $(today)" --body "$body" --head "$(branchName)" --base main --repo infosoftas/didactic-octo-chainsaw --reviewer infosoftas/infosoft-devs -a esbenbach
      displayName: 'Create Pull Request'
      condition: and(succeeded(), eq(variables['anyChanged'], 'true'))
      env:
        GH_TOKEN: $(GitHub.InstallationToken)
