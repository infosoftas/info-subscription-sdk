trigger: none
pr: none

pool:
  name: Release
  demands:
    - Agent.OS -equals Linux

resources:
  repositories:
    - repository: self
      type: github
      name: infosoftas/didactic-octo-chainsaw
      endpoint: Github-SDKs # <-- Service Connection name

variables:
  #githubToken: ${{ secrets.GITHUB_TOKEN }}
  branchName: 'sdk-update-$(Build.BuildId)'
  buildId: '$(Build.BuildId)'
  today: $[ format('{0:yyyy}{0:MM}{0:dd}', pipeline.startTime) ]

stages:
- stage: generate_dotnet
  displayName: 'Generate dotnet sdk'  
  variables:
    changeDetected: true
  jobs:
  - job: generateSdk
    displayName: 'Generate SDKs'
    steps:
    - checkout: self
      persistCredentials: true
    - task: UseDotNet@2
      inputs:
        packageType: 'sdk'
        version: '9.x'

    - task: DotNetCoreCLI@2
      displayName: 'Install kiota as a dotnet tool'
      inputs:
        command: custom
        custom: tool
        arguments: 'install --global Microsoft.OpenApi.Kiota'

    - script: |
        kiota generate --co --openapi https://api.info-subscription.com/swagger/latest/swagger.json --include-path /subscription --include-path /product --include-path /package --include-path /order --include-path /order/** --include-path /subscriber --include-path /vippsmobilepay/agreement**/remote -l csharp -c InfoSubscription -n info.subscription.dotnet --output dotnet-sdk/src/generated-temp
      displayName: 'Generate C# SDK'

    - script: |
        diff -qr dotnet-sdk/src/generated-temp dotnet-sdk/src/generated -x .kiota.log || echo "##vso[task.setvariable variable=changeDetected;isOutput=true]false"
      displayName: 'Compare SDK with existing'

    - script: |
          git config user.name "Azure Pipelines Bot"
          git config user.email "azure-pipelines-bot@users.noreply.github.com"
          # Regenerates onto the old one. Not idealy, but simple!
          git checkout -b dotnet-$(branchname)
          kiota generate --co --openapi https://api.info-subscription.com/swagger/latest/swagger.json --include-path /subscription --include-path /product --include-path /package --include-path /order --include-path /order/** --include-path /subscriber --include-path /vippsmobilepay/agreement**/remote -l csharp -c InfoSubscription -n info.subscription.dotnet --output dotnet-sdk/src/generated
          git add dotnet-sdk/src/generated
          git commit -m "Update SDK from latest OpenAPI spec"
          git push --set-upstream origin dotnet-$(branchname)
          sleep 2 # We wait a bit to avoid issues where the next step happens too fast!
      displayName: 'Create feature branch'
      condition: eq(variables['changeDetected'], 'true')

    - task: jikuma.devops-github-extension.custom-build-release-task.azuredevopsgithub@0
      displayName: 'Create Pull Request'
      condition: eq(variables['changeDetected'], 'true')
      inputs:
        gitHubConnection: 'Github-SDKs'
        body: |
          {
            "title": "SDK Update $(today)",
            "head": "dotnet-$(branchName)",
            "base": "main",
            "body": "Generated by Kiota and ADO"
          }
        githubrestapiurl: https://api.github.com/repos/infosoftas/didactic-octo-chainsaw/pulls

