trigger: none
pr: none

schedules:
- cron: '0 3 * * 1'
  displayName: 'Weekly Monday 03:00 UTC'
  branches:
    include:
    - main
  always: true  # run even if the repo has no new commits — the OpenAPI spec is external

pool:
  name: Release
  demands:
    - Agent.OS -equals Linux

resources:
  repositories:
    - repository: self
      type: github
      name: infosoftas/didactic-octo-chainsaw
      endpoint: Github-SDKs # <-- Service Connection name

variables:
  #githubToken: ${{ secrets.GITHUB_TOKEN }}
  branchName: 'sdk-update-$(today)-$(Build.BuildId)'
  buildId: '$(Build.BuildId)'
  today: $[ format('{0:yyyy}{0:MM}{0:dd}', pipeline.startTime) ]

stages:
- stage: generate_dotnet
  displayName: 'Generate dotnet sdk'  
  variables:
    changeDetected: true
  jobs:
  - job: generateSdk
    displayName: 'Generate SDKs'
    steps:
    - checkout: self
      persistCredentials: true
    - task: UseDotNet@2
      inputs:
        packageType: 'sdk'
        version: '9.x'

    - task: DotNetCoreCLI@2
      displayName: 'Install kiota as a dotnet tool'
      inputs:
        command: custom
        custom: tool
        arguments: 'install --global Microsoft.OpenApi.Kiota'

    - script: |
        kiota generate --co --openapi https://api.info-subscription.com/swagger/latest/swagger.json --include-path /subscription --include-path /product --include-path /package --include-path /order --include-path /order/** --include-path /subscriber --include-path /vippsmobilepay/agreement**/remote -l csharp -c InfoSubscription -n info.subscription.dotnet --output dotnet-sdk/src/generated-temp
      displayName: 'Generate C# SDK'

    - script: |
        diff -qr dotnet-sdk/src/generated-temp dotnet-sdk/src/generated -x .kiota.log || echo "##vso[task.setvariable variable=changeDetected;isOutput=true]false"
      displayName: 'Compare SDK with existing'

    - script: |
          git config user.name "Azure Pipelines Bot"
          git config user.email "azure-pipelines-bot@users.noreply.github.com"
          # Regenerates onto the old one. Not idealy, but simple!
          git checkout -b dotnet-$(branchName)
          kiota generate --co --openapi https://api.info-subscription.com/swagger/latest/swagger.json --include-path /subscription --include-path /product --include-path /package --include-path /order --include-path /order/** --include-path /subscriber --include-path /vippsmobilepay/agreement**/remote -l csharp -c InfoSubscription -n info.subscription.dotnet --output dotnet-sdk/src/generated
          git add dotnet-sdk/src/generated
          git commit -m "Update SDK from latest OpenAPI spec"
          git push --set-upstream origin dotnet-$(branchName)
          sleep 2 # We wait a bit to avoid issues where the next step happens too fast!
          rm -rf dotnet-sdk/src/generated-temp
      displayName: 'Create feature branch'
      condition: eq(variables['changeDetected'], 'true')

    - task: jikuma.devops-github-extension.custom-build-release-task.azuredevopsgithub@0
      displayName: 'Create Pull Request'
      condition: eq(variables['changeDetected'], 'true')
      inputs:
        gitHubConnection: 'Github-SDKs'
        body: |
          {
            "title": "SDK Update $(today)",
            "head": "dotnet-$(branchName)",
            "base": "main",
            "body": "Generated by Kiota and ADO"
          }
        githubrestapiurl: https://api.github.com/repos/infosoftas/didactic-octo-chainsaw/pulls

    - task: UseDotNet@2
      displayName: 'Setup .NET for pack'
      condition: eq(variables['changeDetected'], 'true')
      inputs:
        packageType: 'sdk'
        version: '10.x'

    - script: |
        dotnet pack dotnet-sdk/src/Info.Subscription.Dotnet.csproj \
          --configuration Release \
          -p:Version=0.0.0-preview.$(Build.BuildId) \
          --output $(Build.ArtifactStagingDirectory)/nuget
      displayName: 'Pack NuGet (preview)'
      condition: eq(variables['changeDetected'], 'true')

    - task: DotNetCoreCLI@2
      displayName: 'Push preview package to ADO NuGet feed'
      condition: eq(variables['changeDetected'], 'true')
      inputs:
        command: 'push'
        packagesToPush: '$(Build.ArtifactStagingDirectory)/nuget/*.nupkg'
        publishVstsFeed: 'S4/Internal'

- stage: generate_ts
  displayName: 'Generate TypeScript sdk'
  dependsOn: []
  variables:
    changeDetected: true
  jobs:
  - job: generateSdk
    displayName: 'Generate SDKs'
    steps:
    - checkout: self
      persistCredentials: true
    - task: UseDotNet@2
      inputs:
        packageType: 'sdk'
        version: '9.x'

    - task: DotNetCoreCLI@2
      displayName: 'Install kiota as a dotnet tool'
      inputs:
        command: custom
        custom: tool
        arguments: 'install --global Microsoft.OpenApi.Kiota'

    - script: |
        kiota generate --co --openapi https://api.info-subscription.com/swagger/latest/swagger.json --include-path /subscription --include-path /product --include-path /package --include-path /order --include-path /order/** --include-path /subscriber --include-path /vippsmobilepay/agreement**/remote -l TypeScript -c InfoSubscription -n info.subscription.ts --output typescript-sdk/src/generated-temp
      displayName: 'Generate TS SDK'

    - script: |
        diff -qr typescript-sdk/src/generated-temp typescript-sdk/src/generated -x .kiota.log || echo "##vso[task.setvariable variable=changeDetected;isOutput=true]false"
      displayName: 'Compare SDK with existing'

    - script: |
          git config user.name "Azure Pipelines Bot"
          git config user.email "azure-pipelines-bot@users.noreply.github.com"
          # Regenerates onto the old one. Not idealy, but simple!
          git checkout -b typescript-$(branchName)
          kiota generate --co --openapi https://api.info-subscription.com/swagger/latest/swagger.json --include-path /subscription --include-path /product --include-path /package --include-path /order --include-path /order/** --include-path /subscriber --include-path /vippsmobilepay/agreement**/remote -l TypeScript -c InfoSubscription -n info.subscription.ts --output typescript-sdk/src/generated
          git add typescript-sdk/src/generated
          git commit -m "Update SDK from latest OpenAPI spec"
          git push --set-upstream origin typescript-$(branchName)
          sleep 2 # We wait a bit to avoid issues where the next step happens too fast!
          rm -rf typescript-sdk/src/generated-temp
      displayName: 'Create feature branch'
      condition: eq(variables['changeDetected'], 'true')

    - task: jikuma.devops-github-extension.custom-build-release-task.azuredevopsgithub@0
      displayName: 'Create Pull Request'
      condition: eq(variables['changeDetected'], 'true')
      inputs:
        gitHubConnection: 'Github-SDKs'
        body: |
          {
            "title": "SDK Update $(today)",
            "head": "typescript-$(branchName)",
            "base": "main",
            "body": "Generated by Kiota and ADO"
          }
        githubrestapiurl: https://api.github.com/repos/infosoftas/didactic-octo-chainsaw/pulls

    - task: NodeTool@0
      displayName: 'Setup Node.js for pack'
      condition: eq(variables['changeDetected'], 'true')
      inputs:
        versionSpec: '20.x'

    - script: |
        cd typescript-sdk
        npm ci
        npm run build
        npm version 0.0.0-preview.$(Build.BuildId) --no-git-tag-version
        npm pack --pack-destination $(Build.ArtifactStagingDirectory)/npm
      displayName: 'Build and pack npm (preview)'
      condition: eq(variables['changeDetected'], 'true')

    - task: Npm@1
      displayName: 'Push preview package to ADO npm feed'
      condition: eq(variables['changeDetected'], 'true')
      inputs:
        command: 'publish'
        workingDir: '$(Build.ArtifactStagingDirectory)/npm'
        publishRegistry: 'useFeed'
        publishFeed: 'S4/Internal'

- stage: generate_python
  displayName: 'Generate Python sdk'
  dependsOn: []
  variables:
    changeDetected: true
  jobs:
  - job: generateSdk
    displayName: 'Generate SDKs'
    steps:
    - checkout: self
      persistCredentials: true
    - task: UseDotNet@2
      inputs:
        packageType: 'sdk'
        version: '9.x'

    - task: DotNetCoreCLI@2
      displayName: 'Install kiota as a dotnet tool'
      inputs:
        command: custom
        custom: tool
        arguments: 'install --global Microsoft.OpenApi.Kiota'

    - script: |
        kiota generate --co --openapi https://api.info-subscription.com/swagger/latest/swagger.json --include-path /subscription --include-path /product --include-path /package --include-path /order --include-path /order/** --include-path /subscriber --include-path /vippsmobilepay/agreement**/remote -l python -c InfoSubscription -n info_subscription --output python-sdk/src/info_subscription_sdk/generated-temp
      displayName: 'Generate Python SDK'

    - script: |
        diff -qr python-sdk/src/info_subscription_sdk/generated-temp python-sdk/src/info_subscription_sdk/generated -x .kiota.log || echo "##vso[task.setvariable variable=changeDetected;isOutput=true]false"
      displayName: 'Compare SDK with existing'

    - script: |
          git config user.name "Azure Pipelines Bot"
          git config user.email "azure-pipelines-bot@users.noreply.github.com"
          # Regenerates onto the old one. Not idealy, but simple!
          git checkout -b python-$(branchName)
          kiota generate --co --openapi https://api.info-subscription.com/swagger/latest/swagger.json --include-path /subscription --include-path /product --include-path /package --include-path /order --include-path /order/** --include-path /subscriber --include-path /vippsmobilepay/agreement**/remote -l python -c InfoSubscription -n info_subscription --output python-sdk/src/info_subscription_sdk/generated
          git add python-sdk/src/info_subscription_sdk/generated
          git commit -m "Update SDK from latest OpenAPI spec"
          git push --set-upstream origin python-$(branchName)
          sleep 2 # We wait a bit to avoid issues where the next step happens too fast!
          rm -rf python-sdk/src/info_subscription_sdk/generated-temp
      displayName: 'Create feature branch'
      condition: eq(variables['changeDetected'], 'true')

    - task: jikuma.devops-github-extension.custom-build-release-task.azuredevopsgithub@0
      displayName: 'Create Pull Request'
      condition: eq(variables['changeDetected'], 'true')
      inputs:
        gitHubConnection: 'Github-SDKs'
        body: |
          {
            "title": "SDK Update $(today)",
            "head": "python-$(branchName)",
            "base": "main",
            "body": "Generated by Kiota and ADO"
          }
        githubrestapiurl: https://api.github.com/repos/infosoftas/didactic-octo-chainsaw/pulls

    - task: UsePythonVersion@0
      displayName: 'Setup Python for pack'
      condition: eq(variables['changeDetected'], 'true')
      inputs:
        versionSpec: '3.12'

    - script: |
        pip install build
        cd python-sdk
        sed -i "s/^version = \".*\"/version = \"0.0.0.dev$(Build.BuildId)\"/" pyproject.toml
        python -m build --outdir $(Build.ArtifactStagingDirectory)/python
      displayName: 'Build Python package (preview)'
      condition: eq(variables['changeDetected'], 'true')

    - task: TwineAuthenticate@1
      displayName: 'Authenticate with ADO Python feed'
      condition: eq(variables['changeDetected'], 'true')
      inputs:
        artifactFeed: 'S4/Internal'

    - script: |
        pip install twine
        twine upload -r 'S4/Internal' --config-file $(PYPIRC_PATH) $(Build.ArtifactStagingDirectory)/python/*
      displayName: 'Push preview package to ADO Python feed'
      condition: eq(variables['changeDetected'], 'true')