# Triggered automatically when a semver tag (e.g. 1.2.3) is pushed to GitHub.
# See RELEASE.md for the full release process.
trigger:
  tags:
    include:
      - '[0-9]*'
pr: none

# Pipeline variables
variables:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  DOTNET_NOLOGO: 'true'
  NuGetDirectory: '$(Build.ArtifactStagingDirectory)/nuget'

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: CreateNuget
  displayName: 'Pack NuGet Package'
  jobs:
  - job: create_nuget
    displayName: 'Pack NuGet'
    steps:
    - checkout: self
      fetchDepth: 0  # Required by MinVer to walk history and find tags

    - script: |
        TAG=$(git tag --points-at HEAD)
        if [ -z "$TAG" ]; then
          echo "##vso[task.logissue type=error]No tag found on HEAD. Create and push a semver tag (e.g. 1.2.3) before releasing."
          exit 1
        fi
        echo "Releasing version: $TAG"
        echo "##vso[task.setvariable variable=ReleaseTag;isOutput=true]$TAG"
      name: validateTag
      displayName: 'Validate tag on HEAD'

    - task: UseDotNet@2
      displayName: 'Setup .NET'
      inputs:
        packageType: 'sdk'
        useGlobalJson: true

    - script: |
        dotnet pack --configuration Release --output $(NuGetDirectory)
      displayName: 'Pack NuGet'

    - publish: $(NuGetDirectory)
      artifact: nuget

- stage: PublishInternal
  displayName: 'Publish to Azure Artifacts'
  dependsOn: CreateNuget
  condition: succeeded()
  jobs:
  - job: publish_internal
    displayName: 'Push to ADO feed'
    steps:
    - download: current
      artifact: nuget

    - task: UseDotNet@2
      displayName: 'Setup .NET'
      inputs:
        packageType: 'sdk'
        useGlobalJson: true

    # Uncomment if the agent does not have implicit access to the feed
    # - task: NuGetAuthenticate@1
    #   displayName: 'Authenticate with Azure Artifacts'

    - task: DotNetCoreCLI@2
      displayName: 'Push to Azure Artifacts feed'
      inputs:
        command: 'push'
        packagesToPush: '$(Pipeline.Workspace)/nuget/*.nupkg'
        publishVstsFeed: 'S4/Internal'

- stage: Deploy
  displayName: 'Publish to NuGet.org'
  dependsOn:
  - CreateNuget
  - PublishInternal
  condition: succeeded()
  jobs:
  - job: deploy
    displayName: 'Push to NuGet.org and create GitHub Release'
    variables:
      ReleaseTag: $[ stageDependencies.CreateNuget.create_nuget.outputs['validateTag.ReleaseTag'] ]
    steps:
    - checkout: self
      fetchDepth: 0

    - download: current
      artifact: nuget

    - task: UseDotNet@2
      displayName: 'Setup .NET'
      inputs:
        packageType: 'sdk'
        useGlobalJson: true

    - script: |
        for file in $(Pipeline.Workspace)/nuget/*.nupkg; do
          dotnet nuget push "$file" --api-key "$(NUGET_APIKEY)" --source https://api.nuget.org/v3/index.json --skip-duplicate
        done
      displayName: 'Publish to NuGet.org'
      env:
        NUGET_APIKEY: $(NUGET_APIKEY)

    - script: |
        curl -s -o /dev/null -w "%{http_code}" -X POST \
          -H "Authorization: Bearer $(GITHUB_TOKEN)" \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/infosoftas/didactic-octo-chainsaw/releases \
          -d "{
            \"tag_name\": \"$(ReleaseTag)\",
            \"name\": \"$(ReleaseTag)\",
            \"body\": \"## Packages\n- NuGet: [Infosoft.Info.Subscription.Dotnet@$(ReleaseTag)](https://www.nuget.org/packages/Infosoft.Info.Subscription.Dotnet/$(ReleaseTag))\n- npm: [@infosoft/info-subscription-ts@$(ReleaseTag)](https://www.npmjs.com/package/@infosoft/info-subscription-ts/v/$(ReleaseTag))\n- PyPI: [infosoft-info-subscription@$(ReleaseTag)](https://pypi.org/project/infosoft-info-subscription/$(ReleaseTag)/)\",
            \"generate_release_notes\": true,
            \"make_latest\": \"true\"
          }"
      displayName: 'Create GitHub Release'
      env:
        GITHUB_TOKEN: $(GITHUB_TOKEN)