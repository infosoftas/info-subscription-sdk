# Triggered automatically when a CalVer tag (e.g. 2024.8.1) is pushed to GitHub.
# See RELEASE.md for the full release process.
trigger:
  tags:
    include:
      - '[0-9]*'
pr: none

# Pipeline variables
variables:
  - group: 'NuGet Tools Installation'
  - name: DOTNET_SKIP_FIRST_TIME_EXPERIENCE
    value: '1'
  - name: DOTNET_NOLOGO
    value: 'true'
  - name: NuGetDirectory
    value: '$(Build.ArtifactStagingDirectory)/nuget'

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: CreateNuget
  displayName: 'Pack NuGet Package'
  jobs:
  - job: create_nuget
    displayName: 'Pack NuGet'
    steps:
    - checkout: self
      fetchDepth: 0  # Required by MinVer to walk history and find tags

    - script: |
        TAG=$(git tag --points-at HEAD)
        if [ -z "$TAG" ]; then
          echo "##vso[task.logissue type=error]No tag found on HEAD. Create and push a CalVer tag (e.g. 2024.8.1) before releasing."
          exit 1
        fi
        echo "Releasing version: $TAG"
        echo "##vso[task.setvariable variable=ReleaseTag;isOutput=true]$TAG"
      name: validateTag
      displayName: 'Validate tag on HEAD'

    - task: UseDotNet@2
      displayName: 'Setup .NET'
      inputs:
        packageType: 'sdk'
        useGlobalJson: true

    - script: |
        dotnet pack dotnet-sdk/src/Info.Subscription.Dotnet.csproj --configuration Release --output $(NuGetDirectory) -p:Version=$RELEASE_TAG -p:ContinuousIntegrationBuild=true
      displayName: 'Pack NuGet'
      env:
        RELEASE_TAG: $(validateTag.ReleaseTag)

    - publish: $(NuGetDirectory)
      artifact: nuget

- stage: Deploy
  displayName: 'Publish to NuGet.org'
  dependsOn: CreateNuget
  condition: succeeded()
  jobs:
  - job: deploy
    displayName: 'Push to NuGet.org and create GitHub Release'
    variables:
      ReleaseTag: $[ stageDependencies.CreateNuget.create_nuget.outputs['validateTag.ReleaseTag'] ]
    steps:
    - checkout: self
      fetchDepth: 0

    - download: current
      artifact: nuget

    - task: UseDotNet@2
      displayName: 'Setup .NET'
      inputs:
        packageType: 'sdk'
        useGlobalJson: true

    - script: |
        # nuget.org auto-discovers the matching .snupkg alongside each .nupkg pushed from the same directory
        for file in $(Pipeline.Workspace)/nuget/*.nupkg; do
          dotnet nuget push "$file" --api-key "$(NuGetApiKey)" --source https://api.nuget.org/v3/index.json --skip-duplicate
        done
      displayName: 'Publish to NuGet.org'
      env:
        NuGetApiKey: $(NuGetApiKey)

    - task: get-github-token-task@1
      displayName: Get GitHub token
      name: getGitHubToken
      inputs:
        githubServiceConnection: 'infosoftas'

    - script: |
        if gh release view "$(ReleaseTag)" --repo infosoftas/didactic-octo-chainsaw >/dev/null 2>&1; then
          echo "GitHub Release $(ReleaseTag) already exists -- skipping creation"
        else
          gh release create "$(ReleaseTag)" \
            --repo infosoftas/didactic-octo-chainsaw \
            --title "$(ReleaseTag)" \
            --generate-notes \
            --notes "## Packages
        - NuGet: [Infosoft.Info.Subscription.Dotnet@$(ReleaseTag)](https://www.nuget.org/packages/Infosoft.Info.Subscription.Dotnet/$(ReleaseTag))
        - npm: [@infosoft/info-subscription-ts@$(ReleaseTag)](https://www.npmjs.com/package/@infosoft/info-subscription-ts/v/$(ReleaseTag))
        - PyPI: [infosoft-info-subscription@$(ReleaseTag)](https://pypi.org/project/infosoft-info-subscription/$(ReleaseTag)/)"
        fi
      displayName: 'Create GitHub Release'
      env:
        GH_TOKEN: $(GitHub.InstallationToken)
