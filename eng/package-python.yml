# Triggered automatically when a semver tag (e.g. 1.2.3) is pushed to GitHub.
# See RELEASE.md for the full release process.
trigger:
  tags:
    include:
      - '[0-9]*'
pr: none

variables:
  python.version: '3.12'
  PackageDirectory: '$(Build.ArtifactStagingDirectory)/python'

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: Pack
  displayName: 'Build and Pack Python Package'
  jobs:
  - job: pack_python
    displayName: 'Build and Pack'
    steps:
    - checkout: self
      fetchDepth: 0

    - script: |
        TAG=$(git tag --points-at HEAD)
        if [ -z "$TAG" ]; then
          echo "##vso[task.logissue type=error]No tag found on HEAD. Create and push a semver tag (e.g. 1.2.3) before releasing."
          exit 1
        fi
        echo "Releasing version: $TAG"
        echo "##vso[task.setvariable variable=ReleaseTag]$TAG"
      displayName: 'Validate tag on HEAD'

    - task: UsePythonVersion@0
      displayName: 'Use Python $(python.version)'
      inputs:
        versionSpec: '$(python.version)'

    - task: Cache@2
      displayName: 'Cache pip download cache'
      inputs:
        key: 'pip | "$(Agent.OS)" | "$(python.version)" | python-sdk/requirements.txt | python-sdk/requirements-dev.txt'
        path: '$(HOME)/.cache/pip'
        restoreKeys: |
          pip | "$(Agent.OS)" | "$(python.version)"

    - script: |
        python -m venv .venv
        source .venv/bin/activate
        python -m pip install --upgrade pip setuptools wheel
      displayName: 'Create virtual environment'
      workingDirectory: python-sdk

    - script: |
        source .venv/bin/activate
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install -e .
      displayName: 'Install dependencies'
      workingDirectory: python-sdk

    - script: |
        source .venv/bin/activate
        sed -i "s/^version = \".*\"/version = \"$(ReleaseTag)\"/" pyproject.toml
        python -m build --outdir $(PackageDirectory)
      displayName: 'Inject version and build wheel + sdist'
      workingDirectory: python-sdk

    - publish: $(PackageDirectory)
      artifact: python

- stage: Deploy
  displayName: 'Publish to PyPI'
  dependsOn: Pack
  condition: succeeded()
  jobs:
  - job: deploy_pypi
    displayName: 'Push to PyPI'
    steps:
    - download: current
      artifact: python

    - task: UsePythonVersion@0
      displayName: 'Use Python $(python.version)'
      inputs:
        versionSpec: '$(python.version)'

    - task: Cache@2
      displayName: 'Cache pip download cache'
      inputs:
        key: 'pip | "$(Agent.OS)" | "$(python.version)" | twine'
        path: '$(HOME)/.cache/pip'

    - script: |
        python -m venv .venv
        source .venv/bin/activate
        python -m pip install --upgrade pip setuptools wheel
      displayName: 'Create virtual environment'

    - script: |
        source .venv/bin/activate
        pip install twine
      displayName: 'Install twine'

    - script: |
        source .venv/bin/activate
        twine upload $(Pipeline.Workspace)/python/* \
          --repository-url https://upload.pypi.org/legacy/ \
          --username __token__ \
          --password $(PYPI_TOKEN) \
          --skip-existing
      displayName: 'Publish to PyPI'
      env:
        PYPI_TOKEN: $(PYPI_TOKEN)
