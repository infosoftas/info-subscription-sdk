# Triggered automatically when a CalVer tag (e.g. 2024.8.1) is pushed to GitHub.
# See RELEASE.md for the full release process.
trigger:
  tags:
    include:
      - '[0-9]*'
pr: none

variables:
  PackageDirectory: '$(Build.ArtifactStagingDirectory)/python'

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: Pack
  displayName: 'Build and Pack Python Package'
  jobs:
  - job: pack_python
    displayName: 'Build and Pack'
    steps:
    - checkout: self
      fetchDepth: 0

    - script: |
        TAG=$(git tag --points-at HEAD)
        if [ -z "$TAG" ]; then
          echo "##vso[task.logissue type=error]No tag found on HEAD. Create and push a CalVer tag (e.g. 2024.8.1) before releasing."
          exit 1
        fi
        echo "Releasing version: $TAG"
        echo "##vso[task.setvariable variable=ReleaseTag]$TAG"
      displayName: 'Validate tag on HEAD'

    - script: |
        if command -v python3 &>/dev/null; then
          PYTHON_BIN=python3
        elif command -v python &>/dev/null; then
          PYTHON_BIN=python
        else
          echo "##vso[task.logissue type=error]No Python binary found on PATH"
          exit 1
        fi
        PYTHON_VERSION=$($PYTHON_BIN --version 2>&1 | awk '{print $2}')
        echo "Detected: $PYTHON_BIN ($PYTHON_VERSION)"
        echo "##vso[task.setvariable variable=PYTHON_BIN]$PYTHON_BIN"
        echo "##vso[task.setvariable variable=python.version]$PYTHON_VERSION"
      displayName: 'Detect Python binary'

    - task: Cache@2
      displayName: 'Cache pip download cache'
      inputs:
        key: 'pip | "$(Agent.OS)" | "$(python.version)" | python-sdk/requirements.txt | python-sdk/requirements-dev.txt'
        path: '$(HOME)/.cache/pip'
        restoreKeys: |
          pip | "$(Agent.OS)" | "$(python.version)"

    - script: |
        $(PYTHON_BIN) -m venv .venv
        source .venv/bin/activate
        python -m pip install --upgrade pip setuptools wheel
      displayName: 'Create virtual environment'
      workingDirectory: python-sdk

    - script: |
        source .venv/bin/activate
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install -e .
      displayName: 'Install dependencies'
      workingDirectory: python-sdk

    - script: |
        source .venv/bin/activate
        sed -i "s/^version = \".*\"/version = \"$(ReleaseTag)\"/" pyproject.toml
        python -m build --outdir $(PackageDirectory)
      displayName: 'Inject version and build wheel + sdist'
      workingDirectory: python-sdk

    - publish: $(PackageDirectory)
      artifact: python

- stage: Deploy
  displayName: 'Publish to PyPI'
  dependsOn: Pack
  condition: succeeded()
  jobs:
  - job: deploy_pypi
    displayName: 'Push to PyPI'
    steps:
    - checkout: self
      fetchDepth: 0

    - download: current
      artifact: python

    - script: |
        if command -v python3 &>/dev/null; then
          PYTHON_BIN=python3
        elif command -v python &>/dev/null; then
          PYTHON_BIN=python
        else
          echo "##vso[task.logissue type=error]No Python binary found on PATH"
          exit 1
        fi
        PYTHON_VERSION=$($PYTHON_BIN --version 2>&1 | awk '{print $2}')
        echo "Detected: $PYTHON_BIN ($PYTHON_VERSION)"
        echo "##vso[task.setvariable variable=PYTHON_BIN]$PYTHON_BIN"
        echo "##vso[task.setvariable variable=python.version]$PYTHON_VERSION"
      displayName: 'Detect Python binary'

    - task: Cache@2
      displayName: 'Cache pip download cache'
      inputs:
        key: 'pip | "$(Agent.OS)" | "$(python.version)" | twine'
        path: '$(HOME)/.cache/pip'

    - script: |
        $(PYTHON_BIN) -m venv .venv
        source .venv/bin/activate
        python -m pip install --upgrade pip setuptools wheel
      displayName: 'Create virtual environment'

    - script: |
        source .venv/bin/activate
        pip install twine
      displayName: 'Install twine'

    - script: |
        source .venv/bin/activate
        twine upload $(Pipeline.Workspace)/python/* \
          --repository-url https://upload.pypi.org/legacy/ \
          --username __token__ \
          --password $(PYPI_TOKEN) \
          --skip-existing
      displayName: 'Publish to PyPI'
      env:
        PYPI_TOKEN: $(PYPI_TOKEN)

    - script: |
        TAG=$(git tag --points-at HEAD)
        echo "##vso[task.setvariable variable=ReleaseTag]$TAG"
      displayName: 'Resolve release tag'

    - task: get-github-token-task@1
      displayName: Get GitHub token
      name: getGitHubToken
      inputs:
        githubServiceConnection: 'infosoftas'

    - script: |
        if gh release view "$(ReleaseTag)" --repo infosoftas/info-subscription-sdk >/dev/null 2>&1; then
          echo "GitHub Release $(ReleaseTag) already exists -- skipping creation"
        else
          gh release create "$(ReleaseTag)" \
            --repo infosoftas/info-subscription-sdk \
            --title "$(ReleaseTag)" \
            --generate-notes \
            --notes "## Packages
        - NuGet: [Infosoft.Info.Subscription.Dotnet@$(ReleaseTag)](https://www.nuget.org/packages/Infosoft.Info.Subscription.Dotnet/$(ReleaseTag))
        - npm: [@infosoft/info-subscription-ts@$(ReleaseTag)](https://www.npmjs.com/package/@infosoft/info-subscription-ts/v/$(ReleaseTag))
        - PyPI: [infosoft-info-subscription@$(ReleaseTag)](https://pypi.org/project/infosoft-info-subscription/$(ReleaseTag)/)"
        fi
      displayName: 'Create GitHub Release'
      env:
        GH_TOKEN: $(GitHub.InstallationToken)
