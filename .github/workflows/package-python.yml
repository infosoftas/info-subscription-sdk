# Triggered automatically when a CalVer tag (e.g. 2024.8.1) is pushed to GitHub.
# Replaces historical/reference-only ADO eng/package-python.yml for public PyPI releases.
# See RELEASE.md for full release process.
name: Release Python Package

on:
  push:
    tags:
      - '[0-9]*'

permissions:
  contents: write # needed to create GitHub Releases

env:
  PythonPackageDirectory: python
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  pack:
    name: Build and Pack Python Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag on HEAD
        run: |
          if ! git tag --points-at HEAD | grep -Fx "$RELEASE_TAG" >/dev/null; then
            echo "No tag found on HEAD. Create and push CalVer tag (for example 2024.8.1) before releasing."
            exit 1
          fi

          echo "Releasing version: $RELEASE_TAG"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            python-sdk/requirements.txt
            python-sdk/requirements-dev.txt

      - name: Create virtual environment
        working-directory: python-sdk
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip setuptools wheel

      - name: Install dependencies
        working-directory: python-sdk
        run: |
          source .venv/bin/activate
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Inject version and build wheel + sdist
        working-directory: python-sdk
        run: |
          mkdir -p "../$PythonPackageDirectory"
          source .venv/bin/activate
          sed -i "s/^version = \".*\"/version = \"$RELEASE_TAG\"/" pyproject.toml
          python -m build --outdir "../$PythonPackageDirectory"

      - name: Upload Python artifact
        uses: actions/upload-artifact@v4
        with:
          name: python
          path: ${{ env.PythonPackageDirectory }}
          if-no-files-found: error

  deploy:
    name: Push to PyPI and Create GitHub Release
    runs-on: ubuntu-latest
    needs: pack

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Python artifact
        uses: actions/download-artifact@v4
        with:
          name: python
          path: ${{ env.PythonPackageDirectory }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create virtual environment
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip setuptools wheel

      - name: Install twine
        run: |
          source .venv/bin/activate
          pip install twine

      - name: Publish to PyPI
        run: |
          source .venv/bin/activate
          twine upload "$PythonPackageDirectory"/* \
            --repository-url https://upload.pypi.org/legacy/ \
            --username __token__ \
            --password "${{ secrets.PYPI_TOKEN }}" \
            --skip-existing

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo infosoftas/info-subscription-sdk >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists -- skipping creation"
          else
            gh release create "$RELEASE_TAG" \
              --repo infosoftas/info-subscription-sdk \
              --title "$RELEASE_TAG" \
              --generate-notes \
              --notes "## Packages
          - NuGet: [Infosoft.Info.Subscription.Dotnet@$RELEASE_TAG](https://www.nuget.org/packages/Infosoft.Info.Subscription.Dotnet/$RELEASE_TAG)
          - npm: [@infosoft/info-subscription-ts@$RELEASE_TAG](https://www.npmjs.com/package/@infosoft/info-subscription-ts/v/$RELEASE_TAG)
          - PyPI: [infosoft-info-subscription@$RELEASE_TAG](https://pypi.org/project/infosoft-info-subscription/$RELEASE_TAG/)"
          fi
