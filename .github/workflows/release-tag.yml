# Tag bot: computes the next CalVer version whenever `main` changes under an SDK source tree,
# and pushes that tag -- which triggers the three ADO release pipelines (package-nuget.yml,
# package-npm.yml, package-python.yml), publishing real packages to NuGet.org, npmjs.org and
# PyPI. See RELEASE.md for the CalVer format and what a pushed tag triggers.
#
# Push-triggered runs are live (DRY_RUN=false) now that this behavior has been verified. A manual
# workflow_dispatch run still defaults to dry-run unless `dry_run: false` is explicitly passed, as
# a safety net for on-demand use.
#
# Runs as a GitHub Actions workflow (rather than an ADO pipeline) because it only needs to read
# git tags/history and push a tag back to this same GitHub repo -- no ADO-specific resources
# (agent pools, service connections, internal feeds) are involved.
#
# The tag is pushed using a short-lived token minted for the "infosoftas-release-tag-bot" GitHub
# App (Contents: write only, installed on this repo), NOT the default GITHUB_TOKEN. GitHub
# suppresses push-triggered workflow runs caused by the default GITHUB_TOKEN to prevent recursive
# runs -- which silently prevented package-nuget.yml/package-npm.yml/package-python.yml from ever
# running. Pushing as the App's own identity avoids that suppression so the tag push correctly
# triggers the release pipelines.
name: Release Tag Bot

on:
  push:
    branches:
      - main
    paths:
      - 'dotnet-sdk/src/**'
      - 'typescript-sdk/src/**'
      - 'python-sdk/src/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Log the computed tag without pushing it'
        type: boolean
        default: true

permissions:
  contents: write # needed to push the tag

env:
  # Manual runs default to dry-run (safety net) unless dry_run: false is explicitly passed.
  # Push-triggered runs are live: DRY_RUN=false, so a computed tag is actually pushed.
  DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}


jobs:
  compute-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Mint release-tag-bot App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full tag history to find the highest MICRO this month
          token: ${{ steps.app-token.outputs.token }} # checkout wires this token into git config so later `git push` steps use it, not GITHUB_TOKEN

      - name: Compute next CalVer tag
        id: compute
        run: |
          set -euo pipefail

          HEAD_TAG=$(git tag --points-at HEAD)
          if [ -n "$HEAD_TAG" ]; then
            echo "HEAD is already tagged ($HEAD_TAG). Nothing to do."
            echo "should_tag=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          YEAR=$(date -u +%Y)
          MONTH=$(date -u +%-m) # unpadded month, per RELEASE.md CalVer rules

          HIGHEST_MICRO=0
          for t in $(git tag --list "${YEAR}.${MONTH}.*"); do
            MICRO="${t##*.}"
            if [[ "$MICRO" =~ ^[0-9]+$ ]] && [ "$MICRO" -gt "$HIGHEST_MICRO" ]; then
              HIGHEST_MICRO=$MICRO
            fi
          done

          NEXT_TAG="${YEAR}.${MONTH}.$((HIGHEST_MICRO + 1))"

          echo "Next release tag would be: $NEXT_TAG"
          echo "next_tag=$NEXT_TAG" >> "$GITHUB_OUTPUT"
          echo "should_tag=true" >> "$GITHUB_OUTPUT"

      - name: 'Dry-run: log tag (no push)'
        if: steps.compute.outputs.should_tag == 'true' && env.DRY_RUN == 'true'
        run: |
          echo "[dry-run] Would run: git tag ${{ steps.compute.outputs.next_tag }} && git push origin ${{ steps.compute.outputs.next_tag }}"
          echo "DRY_RUN is on. No tag was created or pushed."

      - name: Push release tag
        if: steps.compute.outputs.should_tag == 'true' && env.DRY_RUN != 'true'
        run: |
          git config user.name "S4 Release Bot"
          git config user.email "s4-release-bot@users.noreply.github.com"
          git tag ${{ steps.compute.outputs.next_tag }}
          git push origin ${{ steps.compute.outputs.next_tag }}
